<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Scadenziere</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#0f1117" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Scadenziere" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

  <!-- Supabase JS -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    /* ── Token di design ── */
    :root {
      --bg:        #0f1117;
      --surface:   #1a1d27;
      --border:    #2a2d3a;
      --accent:    #4f8ef7;
      --accent-hover: #3a7ae0;
      --danger:    #e05c5c;
      --text:      #e8eaf0;
      --text-muted:#7a7f99;
      --radius:    10px;
      --font:      'Inter', system-ui, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* ── Card login ── */
    .login-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 2.5rem 2rem;
      width: 100%;
      max-width: 380px;
    }

    .login-header {
      text-align: center;
      margin-bottom: 2rem;
    }

    .login-header h1 {
      font-size: 1.6rem;
      font-weight: 700;
      letter-spacing: -0.5px;
      color: var(--text);
    }

    .login-header p {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-top: 0.4rem;
    }

    /* ── Campi ── */
    .field {
      margin-bottom: 1.2rem;
    }

    label {
      display: block;
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-bottom: 0.4rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    input[type="email"],
    input[type="password"] {
      width: 100%;
      padding: 0.7rem 0.9rem;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }

    input:focus {
      border-color: var(--accent);
    }

    /* Posizionamento relativo per il contenitore input + occhio */
    .password-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }
    
    /* Padding a destra sull'input per non far sovrapporre il testo all'icona */
    .password-wrapper input {
      padding-right: 2.5rem;
    }
    
    /* Stile per il pulsante con l'icona */
    .toggle-password {
      position: absolute;
      right: 0.75rem;
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      transition: color 0.2s;
    }
    
    .toggle-password:hover {
      color: var(--text);
    }
    
    .toggle-password svg {
      width: 20px;
      height: 20px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    
    /* ── Bottone ── */
    button[type="submit"] {
      width: 100%;
      padding: 0.8rem;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: var(--radius);
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
      margin-top: 0.4rem;
    }

    button[type="submit"]:hover {
      background: var(--accent-hover);
    }

    button[type="submit"]:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* ── Messaggio errore ── */
    .msg {
      display: none;
      margin-top: 1rem;
      padding: 0.7rem 0.9rem;
      border-radius: var(--radius);
      font-size: 0.85rem;
      text-align: center;
    }

    .msg.errore {
      display: block;
      background: rgba(224, 92, 92, 0.15);
      border: 1px solid var(--danger);
      color: var(--danger);
    }

    .msg.info {
      display: block;
      background: rgba(79, 142, 247, 0.1);
      border: 1px solid var(--accent);
      color: var(--accent);
    }
  </style>
</head>
<body>

  <div class="login-card">
    <div class="login-header">
      <h1>Scadenziere</h1>
      <p>Accedi con le tue credenziali</p>
    </div>

    <div class="field">
      <label for="email">Email</label>
      <input type="email" id="email" placeholder="nome@email.com" autocomplete="email" />
    </div>

    <div class="field">
      <label for="password">Password</label>
      <div class="password-wrapper">
        <input type="password" id="password" placeholder="••••••••" autocomplete="current-password" />
        <button type="button" class="toggle-password" id="toggle-password" aria-label="Mostra/nascondi password">
          <!-- Icona Occhio Aperto (di default) -->
          <svg id="eye-icon" viewBox="0 0 24 24">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
            <circle cx="12" cy="12" r="3"></circle>
          </svg>
        </button>
      </div>
    </div>
    
    <button type="submit" id="btn-login">Accedi</button>

    <div class="msg" id="messaggio"></div>
  </div>

  <script>
    // ── Configurazione Supabase ── 
    const SUPABASE_URL  = 'https://wmjncvwjocmdfftughtz.supabase.co';
    const SUPABASE_PUBLISHABLE = 'sb_publishable_GytEH0SOWJm6H2m_KczVAA_2KFNUhzT'
    const { createClient } = supabase;
    const db = createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE);

    // ── Elementi UI ──
    const btnLogin   = document.getElementById('btn-login');
    const inpEmail   = document.getElementById('email');
    const inpPwd     = document.getElementById('password');
    const messaggio  = document.getElementById('messaggio');

    // ── Elementi UI Password ──
    const btnTogglePwd = document.getElementById('toggle-password');
    const eyeIcon      = document.getElementById('eye-icon');
    
    // ── Toggle Password visibile/nascosta ──
    btnTogglePwd.addEventListener('click', () => {
      const isPassword = inpPwd.getAttribute('type') === 'password';
      
      // Cambia il tipo di input
      inpPwd.setAttribute('type', isPassword ? 'text' : 'password');
    
      // Aggiorna l'icona (Occhio Aperto / Occhio Sbarrato)
      if (isPassword) {
        // Icona occhio sbarrato (password visibile)
        eyeIcon.innerHTML = `
          <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
          <line x1="1" y1="1" x2="23" y2="23"></line>
        `;
      } else {
        // Icona occhio normale (password nascosta)
        eyeIcon.innerHTML = `
          <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
          <circle cx="12" cy="12" r="3"></circle>
        `;
      }
    });

    // ── Mostra messaggio ──
    function mostraMessaggio(testo, tipo) {
      messaggio.textContent = testo;
      messaggio.className = 'msg ' + tipo;
    }

    // ── Mostra eventuale messaggio salvato da app.html (es. gruppo sospeso) ──
    const msgSalvato = sessionStorage.getItem('msgLogin');
    if (msgSalvato) {
      mostraMessaggio(msgSalvato, 'errore');
      sessionStorage.removeItem('msgLogin');
    }

    // ── Se già autenticato → vai diretto a app.html ──
    (async () => {
      const { data: { session } } = await db.auth.getSession();
      if (session && !msgSalvato) { window.location.href = 'app.html'; }
    })();

    // ── Login ──
    btnLogin.addEventListener('click', async () => {
      const email    = inpEmail.value.trim();
      const password = inpPwd.value;

      if (!email || !password) {
        mostraMessaggio('Inserisci email e password.', 'errore');
        return;
      }

      btnLogin.disabled = true;
      btnLogin.textContent = 'Accesso in corso…';
      messaggio.className = 'msg';

      const { data, error } = await db.auth.signInWithPassword({ email, password });

      if (error) {
        mostraMessaggio('Credenziali non valide. Riprova.', 'errore');
        btnLogin.disabled = false;
        btnLogin.textContent = 'Accedi';
        return;
      }

      /// Login riuscito — verifica che il gruppo dell'utente sia attivo
      const { data: profilo, error: errProfilo } = await db
        .from('utenti')
        .select('id, attivo, gruppi(attivo)')
        .eq('id', data.user.id)
        .single();

      if (errProfilo || !profilo || !profilo.gruppi || profilo.gruppi.attivo !== true) {
        await db.auth.signOut();
        mostraMessaggio('Il tuo gruppo è stato sospeso. Contatta l\'amministratore.', 'errore');
        btnLogin.disabled = false;
        btnLogin.textContent = 'Accedi';
        return;
      }

      if (profilo.attivo !== true) {
        await db.auth.signOut();
        mostraMessaggio('Il tuo account è stato disabilitato. Contatta l\'amministratore.', 'errore');
        btnLogin.disabled = false;
        btnLogin.textContent = 'Accedi';
        return;
      }

      mostraMessaggio('Accesso effettuato. Caricamento…', 'info');
      window.location.href = 'app.html';
    });

    // ── Invio con tasto Enter ──
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') btnLogin.click();
    });
  </script>

</body>
</html>
